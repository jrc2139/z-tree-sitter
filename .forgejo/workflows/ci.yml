name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ZIG_VERSION: "0.15.2"

jobs:
  test:
    name: Format Check, Test, Build
    runs-on: codeberg-tiny

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Zig
        uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Format check
        run: zig fmt --check src/ examples/ tests/

      - name: Build (all grammars)
        run: zig build -- --all-languages

- name: Run tests
        run: zig build test -- --all-languages --summary all
