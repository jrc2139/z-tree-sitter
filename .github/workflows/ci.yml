name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ZIG_VERSION: "0.15.2"
  TREE_SITTER_VERSION: "0.26.6"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Format check
        run: zig fmt --check src/ examples/ tests/

      - name: Build (all grammars)
        run: zig build -- --all-languages

      - name: Run tests
        run: zig build test -- --all-languages --summary all

  generate-check:
    name: Check parser.c freshness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli@${{ env.TREE_SITTER_VERSION }}
      - name: Regenerate parsers
        run: zig build generate -- --all-languages
      - name: Check for stale parser.c files
        run: git diff --exit-code -- 'grammars/'
