name: Cleanup

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Delete ALL caches and artifacts regardless of age"
        required: false
        default: "false"
        type: boolean

jobs:
  cleanup-caches:
    runs-on: ubuntu-slim
    permissions:
      actions: write
    steps:
      - name: Delete old GitHub Actions caches
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const force = '${{ inputs.force }}' === 'true';
            const daysToKeep = 7;
            const cutoffDate = new Date(Date.now() - daysToKeep * 24 * 60 * 60 * 1000);

            if (force) {
              console.log('FORCE MODE: Deleting ALL caches');
            } else {
              console.log(`Deleting caches older than ${cutoffDate.toISOString()}`);
            }

            const { data } = await github.rest.actions.getActionsCacheList({
              owner: repo.owner,
              repo: repo.repo,
              per_page: 100
            });
            const caches = data.actions_caches || [];

            let deleted = 0;
            for (const cache of caches) {
              const lastAccessed = new Date(cache.last_accessed_at);
              if (force || lastAccessed < cutoffDate) {
                console.log(`Deleting cache: ${cache.key} (last accessed ${cache.last_accessed_at})`);
                await github.rest.actions.deleteActionsCacheById({
                  owner: repo.owner,
                  repo: repo.repo,
                  cache_id: cache.id
                });
                deleted++;
              }
            }

            console.log(`Deleted ${deleted} caches`);
