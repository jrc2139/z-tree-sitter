name: Grammar Assets

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  TREE_SITTER_VERSION: "0.26.9"

jobs:
  generate:
    name: Generate grammar assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli@${{ env.TREE_SITTER_VERSION }}

      - name: Download and generate grammars
        run: |
          mkdir -p grammars/swift grammars/sql

          echo "Downloading swift..."
          curl -fsSL https://github.com/alex-pinkus/tree-sitter-swift/archive/refs/tags/0.7.3.tar.gz \
            | tar xz --strip-components=1 -C grammars/swift

          echo "Downloading sql..."
          curl -fsSL https://github.com/DerekStride/tree-sitter-sql/archive/refs/tags/v0.3.11.tar.gz \
            | tar xz --strip-components=1 -C grammars/sql

          for dir in grammars/swift grammars/sql; do
            echo "Generating $(basename $dir)..."
            (cd "$dir" && tree-sitter generate)
          done

      - name: Create tarballs
        run: |
          mkdir -p dist
          cd grammars

          mv swift tree-sitter-swift-0.7.3
          tar czf ../dist/tree-sitter-swift-0.7.3.tar.gz tree-sitter-swift-0.7.3

          mv sql tree-sitter-sql-0.3.11
          tar czf ../dist/tree-sitter-sql-0.3.11.tar.gz tree-sitter-sql-0.3.11

      - name: Generate checksums
        run: |
          cd dist
          for file in *.tar.gz; do
            sha256sum "$file" > "${file}.sha256"
          done

      - name: Upload to grammar-assets release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create grammar-assets --title "Grammar Assets" \
            --notes "Pre-generated grammar tarballs for grammars missing parser.c upstream." \
            2>/dev/null || true
          gh release upload grammar-assets dist/*.tar.gz dist/*.sha256 --clobber

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
