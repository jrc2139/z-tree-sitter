name: Grammar Assets

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  TREE_SITTER_VERSION: "0.26.6"

jobs:
  generate:
    name: Generate grammar assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli@${{ env.TREE_SITTER_VERSION }}

      - name: Vendor and generate grammars
        run: |
          bash scripts/vendor.sh

          for dir in grammars/swift grammars/sql; do
            echo "Generating $(basename $dir)..."
            (cd "$dir" && tree-sitter generate)
          done

      - name: Create tarballs
        run: |
          mkdir -p dist
          cd grammars

          mv swift tree-sitter-swift-0.7.1
          tar czf ../dist/tree-sitter-swift-0.7.1.tar.gz tree-sitter-swift-0.7.1
          mv tree-sitter-swift-0.7.1 swift

          mv sql tree-sitter-sql-0.3.11
          tar czf ../dist/tree-sitter-sql-0.3.11.tar.gz tree-sitter-sql-0.3.11
          mv tree-sitter-sql-0.3.11 sql

      - name: Upload to grammar-assets release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload grammar-assets dist/*.tar.gz --clobber

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
